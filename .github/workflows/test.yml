name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  embedded-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TARGET_DIR: /mnt/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the sample
        uses: actions/checkout@v4
        with:
          path: aws-emulator-order-pipeline

      - name: Check out AWS Emulator beside it
        uses: actions/checkout@v4
        with:
          repository: aws/aws-emulator
          ref: f515581569b98a9dcbd2e686c12f912fdce51bba
          path: aws-emulator

      - name: Put the build directory on the large disk
        run: sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('aws-emulator-order-pipeline/Cargo.lock') }}

      - name: Run the tests
        working-directory: aws-emulator-order-pipeline
        run: cargo test
